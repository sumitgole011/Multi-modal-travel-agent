name: Travel agent checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: multi-modal-travel-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r multi-modal-travel-agent/requirements.txt
      - name: Run source and offline graph checks
        run: python -m unittest discover -s tests -v
